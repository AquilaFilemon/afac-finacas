{% extends 'financeiro/modelo.html' %}

{% load static %}

{% block extra_css %} <link rel="stylesheet" href="{% static 'financeiro/css/adicionarPrevisao.css' %}"> {% endblock %}

{% block content %} 
    <div class="principal">
        <h1>Adicionar Previsão</h1>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="nome" placeholder="Previsão">
            <input type="number" name="valor" placeholder="Valor">
            {{ form.data }}
            {{ form.ano }}
            <button type="submit">Salvar</button>
        </form>
    </div>
{% endblock %}
